# .github/workflows/test.yml
#
# Run the full test suite with the race detector on every push to main and
# every PR targeting main. This is the workflow the README "Tests" badge
# points at.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -race -count=1

      # testcontainers/ is a nested module, so the root `./...` skips it.
      # Vet compiles it (and its tests) so dependency bumps that break the
      # testcontainers-go API fail here instead of on main.
      - name: Vet testcontainers module
        working-directory: testcontainers
        run: go vet ./...
