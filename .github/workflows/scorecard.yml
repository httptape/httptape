# .github/workflows/scorecard.yml
#
# OpenSSF Scorecard analysis. Runs weekly + on pushes to main.
# Results are published to https://api.scorecard.dev so the README badge
# resolves to the public dashboard.
#
# Adapted from the canonical workflow at
# https://github.com/ossf/scorecard/blob/main/.github/workflows/scorecard-analysis.yml

name: Scorecard supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 1 * * 6'  # Weekly, Saturday 01:30 UTC

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # Upload SARIF to code-scanning
      id-token: write          # OIDC token for publish_results
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # v2.6.0+: fail if api.scorecard.dev rejects the results, so the
          # README badge cannot go stale unnoticed.
          fail_on_publish_error: true

      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
